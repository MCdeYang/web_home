<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>家庭备忘录</title>
  <link rel="stylesheet" href="/assets/galaxy-theme.css">
  <style>
    .notes-page { padding: 2rem 0; }
    
    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .page-title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--jade-light), var(--gold-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .note-card {
      background: linear-gradient(180deg, rgba(22,27,34,0.8) 0%, rgba(22,27,34,0.5) 100%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      backdrop-filter: blur(12px);
    }

    .note-card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .note-card h2 svg {
      width: 24px;
      height: 24px;
      fill: var(--jade-primary);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(1, 4, 9, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--jade-primary);
      box-shadow: 0 0 0 3px var(--jade-glow-dim);
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .member-item {
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      transition: all 0.3s;
    }

    .member-item:hover {
      border-color: var(--jade-primary);
      background: rgba(0, 210, 106, 0.05);
    }

    .member-name {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .member-info {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 400px;
      overflow-y: auto;
    }

    .task-item {
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border-left: 3px solid var(--gold-primary);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      transition: all 0.3s;
    }

    .task-item:hover {
      background: rgba(255, 215, 0, 0.05);
    }

    .task-title {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .task-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .notes-grid {
        grid-template-columns: 1fr;
      }
      
      .page-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body class="galaxy">
  <a href="/index.html" class="galaxy-btn galaxy-home-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
    <span>返回主页</span>
  </a>

  <div class="galaxy-container notes-page">
    <div class="page-header">
      <h1 class="page-title">家庭备忘录</h1>
    </div>

    <div class="notes-grid">
      <!-- 成员管理 -->
      <div class="note-card">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          家庭成员
        </h2>
        <div class="member-list" id="members-list">
          <p class="empty-state">加载中...</p>
        </div>
        <button class="galaxy-btn galaxy-btn-primary" style="margin-top: 1rem; width: 100%;" id="add-member-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          添加成员
        </button>
      </div>

      <!-- 创建任务 -->
      <div class="note-card">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          创建新任务
        </h2>
        <form id="task-form">
          <div class="form-group">
            <label>目标成员</label>
            <select id="target-member" required></select>
          </div>
          <div class="form-group">
            <label>事务内容</label>
            <input type="text" id="task-title" placeholder="例如：买牛奶" required />
          </div>
          <div class="form-group">
            <label>提醒时间</label>
            <input type="datetime-local" id="task-due" required />
          </div>
          <button type="submit" class="galaxy-btn galaxy-btn-gold" style="width: 100%;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
            添加任务
          </button>
        </form>
      </div>

      <!-- 待办事务 -->
      <div class="note-card">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm-8 4H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/></svg>
          待办事务
        </h2>
        <div class="task-list" id="my-tasks-list">
          <p class="empty-state">加载中...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function formatDateForInput(dateStr) {
      return dateStr.replace(' ', 'T');
    }

    function showMsg(msg) {
      alert(msg);
    }

    async function renderMembers() {
      try {
        const res = await fetch('/home/family/members');
        if (!res.ok) throw new Error('获取成员失败');
        const data = await res.json();

        const listEl = document.getElementById('members-list');
        const selectEl = document.getElementById('target-member');

        listEl.innerHTML = '';
        selectEl.innerHTML = '';

        if (data.members.length === 0) {
          listEl.innerHTML = '<p class="empty-state">暂无成员</p>';
          return;
        }

        data.members.forEach(member => {
          const div = document.createElement('div');
          div.className = 'member-item';
          div.innerHTML = `
            <div class="member-name">${member.name}</div>
            <div class="member-info">生日: ${member.birthday} · 微信: ${member.wechat_id.substring(0,6)}...</div>
          `;
          listEl.appendChild(div);

          const opt = document.createElement('option');
          opt.value = member.name;
          opt.textContent = member.name;
          selectEl.appendChild(opt);
        });
      } catch (err) {
        console.error(err);
        document.getElementById('members-list').innerHTML = '<p class="empty-state" style="color: #ff6464;">加载失败</p>';
      }
    }

    async function renderMyTasks() {
      try {
        const res = await fetch('/home/family/members');
        if (!res.ok) throw new Error('获取成员失败');
        const data = await res.json();

        const container = document.getElementById('my-tasks-list');
        let allTasks = [];

        if (data.members && Array.isArray(data.members)) {
          data.members.forEach(member => {
            if (member.tasks && Array.isArray(member.tasks)) {
              member.tasks.forEach(task => {
                const now = new Date();
                const due = new Date(task.due_date.replace(' ', 'T'));
                if (due > now) {
                  allTasks.push({
                    title: task.title,
                    due_date: task.due_date,
                    owner: member.name
                  });
                }
              });
            }
          });
        }

        if (allTasks.length === 0) {
          container.innerHTML = '<p class="empty-state">暂无待办任务</p>';
          return;
        }

        container.innerHTML = '';
        allTasks.forEach(task => {
          const div = document.createElement('div');
          div.className = 'task-item';
          div.innerHTML = `
            <div class="task-title">${task.title}</div>
            <div class="task-meta">${task.due_date} · ${task.owner}</div>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        console.error('加载任务失败:', err);
        document.getElementById('my-tasks-list').innerHTML = `<p class="empty-state" style="color: #ff6464;">加载失败</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMembers();
      renderMyTasks();

      document.getElementById('add-member-btn').addEventListener('click', () => {
        const name = prompt('姓名:');
        const wechat = prompt('微信推送ID (Server酱SCKEY):');
        const birthday = prompt('生日 (MM-DD, 如 06-01):');
        if (!name || !wechat || !birthday) return;

        fetch('/home/family/members', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, wechat_id: wechat, birthday })
        }).then(res => {
          if (res.ok) {
            showMsg('成员添加成功');
            renderMembers();
          } else {
            showMsg('添加失败');
          }
        });
      });

      document.getElementById('task-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const target = document.getElementById('target-member').value;
        const title = document.getElementById('task-title').value;
        const due = document.getElementById('task-due').value;

        const res = await fetch('/home/family/task', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            target_member: target,
            title: title,
            due_date: due.replace('T', ' ')
          })
        });

        if (res.ok) {
          showMsg('任务已添加');
          document.getElementById('task-form').reset();
          renderMyTasks();
        } else {
          showMsg('添加失败');
        }
      });
    });
  </script>
</body>
</html>
