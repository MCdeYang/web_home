<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>系统设置</title>
  <link rel="stylesheet" href="/assets/galaxy-theme.css">
  <style>
    .settings-page { padding: 2rem 0; }
    
    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .page-title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--jade-light), var(--gold-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1.5rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .settings-card {
      background: linear-gradient(180deg, rgba(22,27,34,0.8) 0%, rgba(22,27,34,0.5) 100%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      backdrop-filter: blur(12px);
    }

    .settings-card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--glass-border);
    }

    .settings-card h2 svg {
      width: 24px;
      height: 24px;
      fill: var(--jade-primary);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(1, 4, 9, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--jade-primary);
      box-shadow: 0 0 0 3px var(--jade-glow-dim), 0 0 15px var(--jade-glow-soft);
    }

    .form-group input::placeholder {
      color: var(--text-dim);
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .form-actions .galaxy-btn {
      flex: 1;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 1rem 2rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      color: var(--text-primary);
      font-size: 0.95rem;
      opacity: 0;
      transition: all 0.3s var(--ease-out);
      z-index: 1000;
      backdrop-filter: blur(12px);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: rgba(0, 210, 106, 0.5);
      box-shadow: 0 0 20px var(--jade-glow-dim);
    }

    .toast.error {
      border-color: rgba(255, 100, 100, 0.5);
      box-shadow: 0 0 20px rgba(255, 100, 100, 0.2);
    }

    @media (max-width: 768px) {
      .settings-grid {
        grid-template-columns: 1fr;
      }
      
      .page-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body class="galaxy">
  <a href="/index.html" class="galaxy-btn galaxy-home-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
    <span>返回主页</span>
  </a>

  <div class="galaxy-container settings-page">
    <div class="page-header">
      <h1 class="page-title">系统设置</h1>
    </div>

    <div class="settings-grid">
      <!-- 天气设置 -->
      <div class="settings-card">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
          天气设置
        </h2>
        <form id="weather-form">
          <div class="form-group">
            <label>城市名称</label>
            <input type="text" id="weather-city" placeholder="例如：北京" required />
          </div>
          <div class="form-group">
            <label>和风天气 API Key</label>
            <input type="text" id="weather-key" placeholder="输入您的 API Key" required />
          </div>
          <div class="form-actions">
            <button type="submit" class="galaxy-btn galaxy-btn-primary">保存天气设置</button>
          </div>
        </form>
      </div>

      <!-- 账户设置 -->
      <div class="settings-card">
        <h2>
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          账户设置
        </h2>
        <form id="account-form">
          <div class="form-group">
            <label>新用户名</label>
            <input type="text" id="new-username" placeholder="输入新用户名" />
          </div>
          <div class="form-group">
            <label>新密码</label>
            <input type="password" id="new-password" placeholder="输入新密码" />
          </div>
          <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="confirm-password" placeholder="再次输入密码" />
          </div>
          <div class="form-actions">
            <button type="submit" class="galaxy-btn galaxy-btn-gold">更新账户</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function showToast(message, isSuccess = true) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast' + (isSuccess ? ' success' : ' error');
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // 加载当前天气设置
    async function loadWeatherSettings() {
      try {
        const res = await fetch('/home/settings/weather');
        if (!res.ok) throw new Error('获取设置失败');
        const data = await res.json();
        
        document.getElementById('weather-city').value = data.city || '';
        document.getElementById('weather-key').value = data.api_key || '';
      } catch (err) {
        console.error('加载天气设置失败:', err);
      }
    }

    // 天气设置表单
    document.getElementById('weather-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const city = document.getElementById('weather-city').value.trim();
      const apiKey = document.getElementById('weather-key').value.trim();

      if (!city || !apiKey) {
        showToast('请填写所有字段', false);
        return;
      }

      try {
        const res = await fetch('/home/settings/weather', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ city, api_key: apiKey })
        });

        if (res.ok) {
          showToast('天气设置已保存');
        } else {
          showToast('保存失败', false);
        }
      } catch (err) {
        showToast('网络错误', false);
      }
    });

    // 账户设置表单
    document.getElementById('account-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('new-username').value.trim();
      const password = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!username && !password) {
        showToast('请至少填写一项', false);
        return;
      }

      if (password && password !== confirmPassword) {
        showToast('两次输入的密码不一致', false);
        return;
      }

      try {
        const res = await fetch('/home/settings/account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            username: username || undefined, 
            password: password || undefined 
          })
        });

        if (res.ok) {
          showToast('账户信息已更新');
          document.getElementById('account-form').reset();
        } else {
          showToast('更新失败', false);
        }
      } catch (err) {
        showToast('网络错误', false);
      }
    });

    // 初始化
    loadWeatherSettings();
  </script>
</body>
</html>
