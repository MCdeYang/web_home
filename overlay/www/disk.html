<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>私人网盘</title>
  <link rel="stylesheet" href="/assets/galaxy-theme.css">
  <style>
    .disk-page { padding: 2rem 0; }
    
    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .page-title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--jade-light), var(--gold-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .path-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1rem 1.5rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      margin-bottom: 1.5rem;
      backdrop-filter: blur(12px);
    }

    .path-display {
      font-family: var(--font-mono);
      color: var(--jade-light);
      font-size: 0.95rem;
    }

    .path-actions {
      display: flex;
      gap: 0.5rem;
    }

    #file-upload { display: none; }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
    }

    .file-item {
      background: linear-gradient(180deg, rgba(22,27,34,0.7) 0%, rgba(22,27,34,0.4) 100%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s var(--ease-out);
      position: relative;
      overflow: hidden;
    }

    .file-item:hover {
      transform: translateY(-4px);
      border-color: var(--jade-primary);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 20px var(--jade-glow-dim);
    }

    .file-item.dir {
      border-color: rgba(255, 215, 0, 0.3);
    }

    .file-item.dir:hover {
      border-color: var(--gold-primary);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 20px var(--gold-glow-dim);
    }

    .file-icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
      display: block;
      transition: transform 0.3s;
    }

    .file-item:hover .file-icon {
      transform: scale(1.1);
    }

    .file-name {
      font-size: 0.85rem;
      color: var(--text-secondary);
      word-break: break-all;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    .file-meta {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .file-actions {
      display: flex;
      justify-content: center;
      gap: 0.25rem;
      margin-top: 0.5rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .file-item:hover .file-actions {
      opacity: 1;
    }

    .file-action-btn {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-action-btn:hover {
      border-color: var(--jade-primary);
      color: var(--jade-light);
      background: rgba(0, 210, 106, 0.1);
    }

    .file-action-btn.delete:hover {
      border-color: #ff6464;
      color: #ff6464;
      background: rgba(255, 100, 100, 0.1);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 1rem 2rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      color: var(--text-primary);
      font-size: 0.95rem;
      opacity: 0;
      transition: all 0.3s var(--ease-out);
      z-index: 1000;
      backdrop-filter: blur(12px);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.error {
      border-color: rgba(255, 100, 100, 0.5);
      box-shadow: 0 0 20px rgba(255, 100, 100, 0.2);
    }

    @media (max-width: 768px) {
      .file-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }
      
      .path-bar {
        flex-direction: column;
        align-items: stretch;
      }
      
      .page-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body class="galaxy">
  <a href="/index.html" class="galaxy-btn galaxy-home-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
    <span>返回主页</span>
  </a>

  <div class="galaxy-container disk-page">
    <div class="page-header">
      <h1 class="page-title">私人网盘</h1>
    </div>

    <div class="path-bar">
      <div class="path-display" id="current-path">/</div>
      <div class="path-actions">
        <button class="galaxy-btn" id="refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
          刷新
        </button>
        <button class="galaxy-btn galaxy-btn-primary" id="upload-trigger">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
          </svg>
          上传
        </button>
        <input type="file" id="file-upload" multiple />
        <button class="galaxy-btn galaxy-btn-gold" id="new-folder">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
          </svg>
          新建文件夹
        </button>
      </div>
    </div>

    <div class="file-grid" id="file-list"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentPath = '/';

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast' + (isError ? ' error' : '');
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    async function renameItem(oldName) {
      const newName = prompt('请输入新名称：', oldName);
      if (!newName) return;

      const trimmed = newName.trim();
      if (trimmed === '') {
        showToast('名称不能为空', true);
        return;
      }
      if (trimmed === oldName) {
        showToast('新名称不能与原名称相同', true);
        return;
      }

      try {
        const res = await fetch('/home/disk/rename', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            path: currentPath,
            old_name: oldName,
            new_name: trimmed
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || '重命名失败');
        }

        showToast('重命名成功');
        loadCurrentDir();
      } catch (err) {
        showToast('错误: ' + err.message, true);
      }
    }

    function isImageFile(name) {
      const ext = name.split('.').pop().toLowerCase();
      return ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg'].includes(ext);
    }

    function isPreviewableInline(name) {
      const ext = name.split('.').pop().toLowerCase();
      return ['pdf', 'txt', 'mp4', 'webm', 'ogg', 'mp3', 'wav', 'flac'].includes(ext);
    }

    function getFileIcon(name, isDir) {
      if (isDir) return '📁';
      
      const ext = name.split('.').pop().toLowerCase();
      const iconMap = {
        'pdf': '📄', 'doc': '📝', 'docx': '📝',
        'xls': '📊', 'xlsx': '📊', 'csv': '📊',
        'ppt': '📽️', 'pptx': '📽️',
        'txt': '📃', 'md': '📃', 'log': '📃',
        'js': '📜', 'ts': '📜', 'py': '🐍', 'java': '☕',
        'html': '🌐', 'htm': '🌐', 'css': '🎨',
        'json': '⚙️', 'xml': '📐', 'yaml': '📋',
        'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🎬',
        'mp3': '🎵', 'mp4': '🎬', 'zip': '📦', 'rar': '📦'
      };
      
      return iconMap[ext] || '📄';
    }

    async function uploadFile(file, targetPath) {
      if (targetPath === '') targetPath = '/';
      if (!targetPath.startsWith('/')) targetPath = '/' + targetPath;

      const formData = new FormData();
      formData.append('file', file);

      const url = `/home/disk/upload?path=${encodeURIComponent(targetPath)}`;
      const res = await fetch(url, {
        method: 'POST',
        credentials: 'include',
        body: formData
      });

      if (!res.ok) {
        let errMsg = `HTTP ${res.status}`;
        try {
          const json = await res.json();
          errMsg += ': ' + (json.message || json.error || 'Upload failed');
        } catch (e) {
          const text = await res.text().catch(() => '');
          if (text) errMsg += ': ' + text.substring(0, 100);
        }
        throw new Error(errMsg);
      }
    }

    async function createFolder(name) {
      const params = new URLSearchParams();
      params.append('name', name.trim());
      if (currentPath !== '/') {
        const relPath = currentPath.startsWith('/') ? currentPath.substring(1) : currentPath;
        params.append('path', relPath);
      }

      const res = await fetch('/home/disk/mkdir', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || '创建失败');
      }
    }

    async function deleteItem(name) {
      const fullPath = currentPath === '/' ? `/${name}` : `${currentPath}/${name}`;
      const url = `/home/disk/delete?path=${encodeURIComponent(fullPath)}`;
      const res = await fetch(url, {
        method: 'DELETE',
        credentials: 'include'
      });
      if (!res.ok) throw new Error('删除失败');
    }

    function openFile(name) {
      const fullPath = currentPath === '/' ? `/${name}` : `${currentPath}/${name}`;
      const url = `/home/disk/download?path=${encodeURIComponent(fullPath)}`;

      if (isImageFile(name) || isPreviewableInline(name)) {
        window.open(url, '_blank');
      } else {
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    async function loadDir(path) {
      const url = `/home/disk/list?path=${encodeURIComponent(path)}`;
      const res = await fetch(url, { credentials: 'include' });
      if (!res.ok) throw new Error('加载目录失败');
      const data = await res.json();
      return data.files || [];
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp * 1000);
      const now = new Date();
      const diff = now - date;
      if (diff < 24 * 60 * 60 * 1000) {
        return date.toLocaleTimeString('zh-CN');
      }
      return date.toLocaleDateString('zh-CN');
    }

    async function renderFiles(files) {
      const list = document.getElementById('file-list');
      list.innerHTML = '';

      if (currentPath !== '/') {
        const upItem = document.createElement('div');
        upItem.className = 'file-item dir';
        upItem.innerHTML = `
          <span class="file-icon">📂</span>
          <div class="file-name">..</div>
          <div class="file-meta">返回上级</div>
        `;
        upItem.onclick = () => {
          const parts = currentPath.split('/').filter(p => p);
          parts.pop();
          currentPath = parts.length ? '/' + parts.join('/') : '/';
          loadCurrentDir();
        };
        list.appendChild(upItem);
      }

      files.forEach((file) => {
        const item = document.createElement('div');
        item.className = `file-item ${file.is_dir ? 'dir' : ''}`;

        const icon = getFileIcon(file.name, file.is_dir);

        item.innerHTML = `
          <span class="file-icon">${icon}</span>
          <div class="file-name">${file.name}</div>
          <div class="file-meta">${file.is_dir ? '文件夹' : formatBytes(file.size)} · ${formatDate(file.mtime)}</div>
          <div class="file-actions">
            ${!file.is_dir ? `<button class="file-action-btn" onclick="event.stopPropagation();openFile('${file.name}')">打开</button>` : ''}
            <button class="file-action-btn" onclick="event.stopPropagation();renameItem('${file.name.replace(/'/g, "\\'")}')">重命名</button>
            <button class="file-action-btn delete" onclick="event.stopPropagation();deleteFile('${file.name.replace(/'/g, "\\'")}')">删除</button>
          </div>
        `;

        if (file.is_dir) {
          item.onclick = () => {
            currentPath = currentPath === '/' ? `/${file.name}` : `${currentPath}/${file.name}`;
            loadCurrentDir();
          };
        } else {
          item.onclick = () => openFile(file.name);
        }

        list.appendChild(item);
      });
    }

    async function deleteFile(name) {
      if (!confirm(`确定删除 "${name}" 吗？`)) return;
      try {
        await deleteItem(name);
        showToast('已删除');
        loadCurrentDir();
      } catch (err) {
        showToast('删除失败: ' + err.message, true);
      }
    }

    async function loadCurrentDir() {
      document.getElementById('current-path').textContent = currentPath;
      try {
        const files = await loadDir(currentPath);
        renderFiles(files);
      } catch (err) {
        showToast('加载失败: ' + err.message, true);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('refresh').onclick = () => loadCurrentDir();

      document.getElementById('upload-trigger').onclick = () => {
        document.getElementById('file-upload').click();
      };

      document.getElementById('file-upload').addEventListener('change', async (e) => {
        const files = e.target.files;
        if (!files.length) return;

        for (let file of files) {
          try {
            await uploadFile(file, currentPath);
          } catch (err) {
            showToast(`上传 "${file.name}" 失败: ${err.message}`, true);
            return;
          }
        }
        showToast('上传完成');
        loadCurrentDir();
        e.target.value = '';
      });

      document.getElementById('new-folder').onclick = async () => {
        const name = prompt('请输入文件夹名称：');
        if (!name || name.trim() === '') return;
        try {
          await createFolder(name);
          showToast('文件夹创建成功');
          loadCurrentDir();
        } catch (err) {
          showToast('创建失败: ' + err.message, true);
        }
      };

      loadCurrentDir();
    });

    window.openFile = openFile;
    window.renameItem = renameItem;
    window.deleteFile = deleteFile;
  </script>
</body>
</html>
