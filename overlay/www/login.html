<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>家庭智能终端 - 登录</title>
  <link rel="stylesheet" href="/assets/galaxy-theme.css" id="theme-css">
  <script src="/assets/theme-switcher.js"></script>
  <style>
    /* 登录页特定样式 - 使用CSS变量适配各主题 */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
    }

    .login-panel {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background: var(--login-panel-bg, linear-gradient(180deg, rgba(22,27,34,0.9) 0%, rgba(22,27,34,0.6) 100%));
      border: 1px solid var(--glass-border, rgba(255,255,255,0.1));
      border-top: 2px solid var(--accent-color, var(--jade-primary, #00d26a));
      border-radius: var(--radius-xl, 24px);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow-lg, 0 8px 40px rgba(0,0,0,0.6)), 0 0 60px var(--accent-glow-dim, rgba(0,210,106,0.1));
      animation: floatIn 0.8s var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1)) both;
      position: relative;
      overflow: hidden;
    }

    .login-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-color, var(--jade-primary, #00d26a)), var(--gold-primary, #ffd700), transparent);
      opacity: 0.8;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      fill: var(--accent-color, var(--jade-primary, #00d26a));
      filter: drop-shadow(0 0 20px var(--accent-glow, rgba(0,210,106,0.5)));
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--accent-glow, rgba(0,210,106,0.5))); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 25px var(--accent-glow, rgba(0,210,106,0.5))); }
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--accent-light, var(--jade-light, #4ade80)), var(--gold-primary, #ffd700));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-time {
      font-size: 0.9rem;
      color: var(--text-muted, #6e7681);
      font-family: var(--font-mono, 'SF Mono', Monaco, monospace);
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
      display: flex;
      align-items: center;
      background: var(--login-input-bg, rgba(1, 4, 9, 0.6));
      border: 1px solid var(--glass-border, rgba(255,255,255,0.1));
      border-radius: var(--radius-md, 12px);
      padding: 0 1rem;
      transition: all 0.3s var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1));
    }

    .form-group:focus-within {
      border-color: var(--accent-color, var(--jade-primary, #00d26a));
      box-shadow: 0 0 0 3px var(--accent-glow-dim, rgba(0,210,106,0.1)), 0 0 20px var(--accent-glow-soft, rgba(0,210,106,0.2));
      background: var(--login-input-focus-bg, rgba(1, 4, 9, 0.8));
    }

    .form-input {
      flex: 1;
      padding: 1rem 0.75rem;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: var(--text-primary, #f0f6fc);
      font-size: 1rem;
      outline: none !important;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    .form-input::placeholder {
      color: var(--text-dim, #8b949e);
    }

    .form-icon {
      width: 22px;
      height: 22px;
      fill: var(--text-muted, #6e7681);
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .form-group:focus-within .form-icon {
      fill: var(--accent-color, var(--jade-primary, #00d26a));
      filter: drop-shadow(0 0 5px var(--accent-glow, rgba(0,210,106,0.5)));
    }

    /* 密码可见性切换按钮 */
    .password-toggle {
      width: 24px;
      height: 24px;
      cursor: pointer;
      fill: var(--text-muted, #6e7681);
      transition: all 0.3s;
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 0.5rem;
    }

    .password-toggle:hover {
      fill: var(--accent-color, var(--jade-primary, #00d26a));
    }

    .form-group:focus-within .password-toggle {
      fill: var(--accent-color, var(--jade-primary, #00d26a));
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      margin-top: 0.5rem;
      background: var(--login-btn-bg, linear-gradient(135deg, rgba(0, 210, 106, 0.2), rgba(0, 210, 106, 0.05)));
      border: 1px solid var(--login-btn-border, rgba(0, 210, 106, 0.5));
      border-radius: var(--radius-md, 12px);
      color: var(--accent-light, var(--jade-light, #4ade80));
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s ease;
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:hover {
      background: var(--login-btn-hover-bg, linear-gradient(135deg, rgba(0, 210, 106, 0.3), rgba(0, 210, 106, 0.1)));
      border-color: var(--accent-color, var(--jade-primary, #00d26a));
      box-shadow: 0 0 30px var(--accent-glow-soft, rgba(0,210,106,0.2)), inset 0 0 10px var(--accent-glow-dim, rgba(0,210,106,0.1));
      text-shadow: 0 0 8px var(--accent-glow, rgba(0,210,106,0.5));
      transform: translateY(-2px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      color: #ff6b6b;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.4rem;
      font-size: 0.9rem;
      text-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
    }

    /* YYMK 品牌标识 */
    .brand-logo {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted, #6e7681);
      opacity: 0.6;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* 装饰性粒子 */
    .particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* 主题选择器 - 登录页 */
    .theme-selector {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 100;
    }

    .theme-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--glass-border, rgba(255,255,255,0.1));
      background: var(--glass-bg, rgba(22,27,34,0.8));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      box-shadow: var(--shadow-md, 0 4px 20px rgba(0,0,0,0.5));
    }

    .theme-btn:hover {
      transform: scale(1.1);
      border-color: var(--accent-color, var(--jade-primary, #00d26a));
      box-shadow: 0 0 20px var(--accent-glow, rgba(0,210,106,0.5));
    }

    .theme-btn svg {
      width: 24px;
      height: 24px;
      fill: var(--text-primary, #f0f6fc);
    }

    .theme-dropdown {
      position: absolute;
      bottom: 60px;
      right: 0;
      background: var(--glass-bg, rgba(22,27,34,0.9));
      border: 1px solid var(--glass-border, rgba(255,255,255,0.1));
      border-radius: var(--radius-md, 12px);
      padding: 0.75rem;
      min-width: 180px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.3s;
      box-shadow: var(--shadow-lg, 0 8px 40px rgba(0,0,0,0.6));
    }

    .theme-dropdown.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm, 8px);
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-option:hover {
      background: rgba(255,255,255,0.1);
    }

    .theme-option.active {
      background: var(--accent-glow-dim, rgba(0,210,106,0.1));
    }

    .theme-preview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--glass-border, rgba(255,255,255,0.2));
    }

    .theme-name {
      font-size: 0.9rem;
      color: var(--text-primary, #f0f6fc);
    }

    @media (max-width: 480px) {
      .login-panel {
        padding: 2rem 1.5rem;
      }
      
      .login-title {
        font-size: 1.5rem;
      }
      
      .login-logo {
        width: 48px;
        height: 48px;
      }

      .theme-selector {
        bottom: 1rem;
        right: 1rem;
      }
    }
  </style>
</head>
<body class="galaxy">
  <canvas id="particles-bg" class="particles-bg"></canvas>
  
  <div class="login-page">
    <div class="login-panel">
      <div class="login-header">
        <svg class="login-logo" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <h1 class="login-title">家庭智能终端</h1>
        <div class="login-time" id="currentTime">----/--/-- --:--:--</div>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <svg class="form-icon" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <input type="text" id="username" class="form-input" placeholder="用户名" required autocomplete="off" />
        </div>
        
        <div class="form-group">
          <svg class="form-icon" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
          <input type="password" id="password" class="form-input" placeholder="密码" required />
          <button type="button" class="password-toggle" id="passwordToggle" title="显示/隐藏密码">
            <!-- 眼睛图标 - 睁开 -->
            <svg id="eyeOpen" viewBox="0 0 24 24" style="display: none;">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <!-- 眼睛图标 - 闭合 -->
            <svg id="eyeClosed" viewBox="0 0 24 24">
              <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
            </svg>
          </button>
        </div>
        
        <button type="submit" class="login-btn">登录</button>
        <div id="errorMsg" class="error-msg"></div>
        <div class="brand-logo">YYMK</div>
      </form>
    </div>
  </div>

  <!-- 主题选择器 -->
  <div class="theme-selector">
    <button class="theme-btn" id="themeBtn" title="切换主题">
      <svg viewBox="0 0 24 24">
        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
      </svg>
    </button>
    <div class="theme-dropdown" id="themeDropdown">
      <div class="theme-option" data-theme="galaxy">
        <div class="theme-preview" style="background: linear-gradient(135deg, #00d26a, #ffd700);"></div>
        <span class="theme-name">翡翠流金</span>
      </div>
      <div class="theme-option" data-theme="sky-cartoon">
        <div class="theme-preview" style="background: linear-gradient(135deg, #4fc3f7, #ffd54f);"></div>
        <span class="theme-name">天空卡通</span>
      </div>
      <div class="theme-option" data-theme="dark-luxury">
        <div class="theme-preview" style="background: linear-gradient(135deg, #0a0e27, #f59e0b);"></div>
        <span class="theme-name">黑蓝奢华</span>
      </div>
      <div class="theme-option" data-theme="colorful">
        <div class="theme-preview" style="background: linear-gradient(135deg, #9c27b0, #ff5722);"></div>
        <span class="theme-name">彩色活力</span>
      </div>
      <div class="theme-option" data-theme="moonlight">
        <div class="theme-preview" style="background: linear-gradient(135deg, #1a1a2e, #ffd700);"></div>
        <span class="theme-name">月光写实</span>
      </div>
      <div class="theme-option" data-theme="chinese-knot">
        <div class="theme-preview" style="background: linear-gradient(135deg, #c41e3a, #ffd700);"></div>
        <span class="theme-name">中国结</span>
      </div>
    </div>
  </div>

  <script>
    // === 主题管理 ===
    const themes = {
      galaxy: { name: '翡翠流金', css: '/assets/galaxy-theme.css' },
      'sky-cartoon': { name: '天空卡通', css: '/assets/themes/sky-cartoon-theme.css' },
      'dark-luxury': { name: '黑蓝奢华', css: '/assets/themes/dark-luxury-theme.css' },
      colorful: { name: '彩色活力', css: '/assets/themes/colorful-theme.css' },
      moonlight: { name: '月光写实', css: '/assets/themes/moonlight-theme.css' },
      'chinese-knot': { name: '中国结', css: '/assets/themes/chinese-knot-theme.css' }
    };

    // 登录页默认使用翡翠流金风格
    let currentTheme = 'galaxy';

    function applyTheme(themeName) {
      const theme = themes[themeName];
      if (!theme) return;

      currentTheme = themeName;
      document.body.className = themeName;
      
      const themeCss = document.getElementById('theme-css');
      if (themeCss) {
        themeCss.href = theme.css;
      }

      // 更新CSS变量
      updateThemeVariables(themeName);

      // 更新粒子颜色
      updateParticleColors(themeName);

      // 保存到localStorage
      localStorage.setItem('theme', themeName);

      // 更新下拉菜单选中状态
      document.querySelectorAll('.theme-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.theme === themeName);
      });
    }

    function updateThemeVariables(themeName) {
      const root = document.documentElement;
      const themeVars = {
        galaxy: {
          '--accent-color': '#00d26a',
          '--accent-light': '#4ade80',
          '--accent-glow': 'rgba(0, 210, 106, 0.5)',
          '--accent-glow-soft': 'rgba(0, 210, 106, 0.2)',
          '--accent-glow-dim': 'rgba(0, 210, 106, 0.1)',
          '--login-panel-bg': 'linear-gradient(180deg, rgba(22,27,34,0.9) 0%, rgba(22,27,34,0.6) 100%)',
          '--login-input-bg': 'rgba(1, 4, 9, 0.6)',
          '--login-input-focus-bg': 'rgba(1, 4, 9, 0.8)',
          '--login-btn-bg': 'linear-gradient(135deg, rgba(0, 210, 106, 0.2), rgba(0, 210, 106, 0.05))',
          '--login-btn-border': 'rgba(0, 210, 106, 0.5)',
          '--login-btn-hover-bg': 'linear-gradient(135deg, rgba(0, 210, 106, 0.3), rgba(0, 210, 106, 0.1))'
        },
        'sky-cartoon': {
          '--accent-color': '#4fc3f7',
          '--accent-light': '#81d4fa',
          '--accent-glow': 'rgba(79, 195, 247, 0.5)',
          '--accent-glow-soft': 'rgba(79, 195, 247, 0.2)',
          '--accent-glow-dim': 'rgba(79, 195, 247, 0.1)',
          '--login-panel-bg': 'rgba(255, 255, 255, 0.95)',
          '--login-input-bg': 'rgba(255, 255, 255, 0.9)',
          '--login-input-focus-bg': 'rgba(255, 255, 255, 1)',
          '--login-btn-bg': 'linear-gradient(135deg, rgba(79, 195, 247, 0.3), rgba(79, 195, 247, 0.1))',
          '--login-btn-border': 'rgba(79, 195, 247, 0.6)',
          '--login-btn-hover-bg': 'linear-gradient(135deg, rgba(79, 195, 247, 0.4), rgba(79, 195, 247, 0.2))',
          '--text-primary': '#1565c0',
          '--text-muted': '#424242',
          '--glass-bg': 'rgba(255, 255, 255, 0.95)'
        },
        'dark-luxury': {
          '--accent-color': '#f59e0b',
          '--accent-light': '#fbbf24',
          '--accent-glow': 'rgba(245, 158, 11, 0.5)',
          '--accent-glow-soft': 'rgba(245, 158, 11, 0.2)',
          '--accent-glow-dim': 'rgba(245, 158, 11, 0.1)',
          '--login-panel-bg': 'linear-gradient(180deg, rgba(20, 25, 45, 0.95) 0%, rgba(20, 25, 45, 0.8) 100%)',
          '--login-input-bg': 'rgba(10, 14, 39, 0.6)',
          '--login-input-focus-bg': 'rgba(10, 14, 39, 0.8)',
          '--login-btn-bg': 'linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.05))',
          '--login-btn-border': 'rgba(245, 158, 11, 0.5)',
          '--login-btn-hover-bg': 'linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(245, 158, 11, 0.1))'
        },
        colorful: {
          '--accent-color': '#ff6b6b',
          '--accent-light': '#ffd93d',
          '--accent-glow': 'rgba(255, 107, 107, 0.5)',
          '--accent-glow-soft': 'rgba(255, 107, 107, 0.2)',
          '--accent-glow-dim': 'rgba(255, 107, 107, 0.1)',
          '--login-panel-bg': 'rgba(255, 255, 255, 0.95)',
          '--login-input-bg': 'rgba(255, 255, 255, 0.9)',
          '--login-input-focus-bg': 'rgba(255, 255, 255, 1)',
          '--login-btn-bg': 'linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(255, 107, 107, 0.05))',
          '--login-btn-border': 'rgba(255, 107, 107, 0.5)',
          '--login-btn-hover-bg': 'linear-gradient(135deg, rgba(255, 107, 107, 0.3), rgba(255, 107, 107, 0.1))',
          '--text-primary': '#333333',
          '--text-muted': '#666666',
          '--glass-bg': 'rgba(255, 255, 255, 0.95)'
        },
        moonlight: {
          '--accent-color': '#ffd700',
          '--accent-light': '#ffed4e',
          '--accent-glow': 'rgba(255, 215, 0, 0.5)',
          '--accent-glow-soft': 'rgba(255, 215, 0, 0.2)',
          '--accent-glow-dim': 'rgba(255, 215, 0, 0.1)',
          '--login-panel-bg': 'linear-gradient(180deg, rgba(30, 30, 35, 0.9) 0%, rgba(30, 30, 35, 0.7) 100%)',
          '--login-input-bg': 'rgba(20, 20, 25, 0.6)',
          '--login-input-focus-bg': 'rgba(20, 20, 25, 0.8)',
          '--login-btn-bg': 'linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05))',
          '--login-btn-border': 'rgba(255, 215, 0, 0.5)',
          '--login-btn-hover-bg': 'linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.1))'
        },
        'chinese-knot': {
          '--accent-color': '#ffd700',
          '--accent-light': '#ffed4e',
          '--accent-glow': 'rgba(255, 215, 0, 0.5)',
          '--accent-glow-soft': 'rgba(255, 215, 0, 0.2)',
          '--accent-glow-dim': 'rgba(255, 215, 0, 0.1)',
          '--login-panel-bg': 'linear-gradient(180deg, rgba(139, 0, 0, 0.9) 0%, rgba(139, 0, 0, 0.7) 100%)',
          '--login-input-bg': 'rgba(100, 0, 0, 0.6)',
          '--login-input-focus-bg': 'rgba(100, 0, 0, 0.8)',
          '--login-btn-bg': 'linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05))',
          '--login-btn-border': 'rgba(255, 215, 0, 0.5)',
          '--login-btn-hover-bg': 'linear-gradient(135deg, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.1))'
        }
      };

      const vars = themeVars[themeName] || themeVars.galaxy;
      Object.entries(vars).forEach(([key, value]) => {
        root.style.setProperty(key, value);
      });
    }

    function updateParticleColors(themeName) {
      const colorMap = {
        galaxy: ['0, 210, 106', '255, 215, 0'],
        'sky-cartoon': ['79, 195, 247', '255, 213, 79'],
        'dark-luxury': ['245, 158, 11', '192, 192, 192'],
        colorful: ['156, 39, 176', '233, 30, 99'],
        moonlight: ['255, 215, 0', '200, 200, 200'],
        'chinese-knot': ['255, 215, 0', '196, 30, 58']
      };
      window.particleColors = colorMap[themeName] || colorMap.galaxy;
    }

    // === 密码可见性切换 ===
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    passwordToggle.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeOpen.style.display = isPassword ? 'block' : 'none';
      eyeClosed.style.display = isPassword ? 'none' : 'block';
    });

    // === 主题选择器 ===
    const themeBtn = document.getElementById('themeBtn');
    const themeDropdown = document.getElementById('themeDropdown');

    themeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      themeDropdown.classList.toggle('show');
    });

    document.addEventListener('click', (e) => {
      if (!themeDropdown.contains(e.target) && e.target !== themeBtn) {
        themeDropdown.classList.remove('show');
      }
    });

    document.querySelectorAll('.theme-option').forEach(option => {
      option.addEventListener('click', () => {
        const theme = option.dataset.theme;
        applyTheme(theme);
        themeDropdown.classList.remove('show');
      });
    });

    // === 背景粒子动画 ===
    function initParticles() {
      const canvas = document.getElementById('particles-bg');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      let particles = [];
      
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      
      resize();
      window.addEventListener('resize', resize);
      
      class Particle {
        constructor() {
          this.reset();
        }
        
        reset() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.2;
          this.speedY = (Math.random() - 0.5) * 0.2;
          this.opacity = Math.random() * 0.4 + 0.1;
          const colors = window.particleColors || ['0, 210, 106', '255, 215, 0'];
          this.color = colors[Math.floor(Math.random() * colors.length)];
        }
        
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          
          if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.reset();
          }
        }
        
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
          ctx.fill();
        }
      }
      
      const particleCount = Math.min(50, Math.floor((canvas.width * canvas.height) / 20000));
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
      
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        
        requestAnimationFrame(animate);
      }
      
      animate();
    }

    // === 登录逻辑 ===
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      if (!username || !password) {
        errorMsg.textContent = '请输入用户名和密码';
        return;
      }

      try {
        const response = await fetch('/home/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          window.location.href = '/index.html';
        } else {
          errorMsg.textContent = data.message || '用户名或密码错误';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorMsg.textContent = '网络错误，请检查设备连接';
      }
    });

    // === 时间更新 ===
    function updateTime() {
      const now = new Date();
      const timeStr = now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0') + ' ' +
        String(now.getHours()).padStart(2,'0') + ':' +
        String(now.getMinutes()).padStart(2,'0') + ':' +
        String(now.getSeconds()).padStart(2,'0');
      document.getElementById('currentTime').textContent = timeStr;
    }

    // 初始化
    applyTheme(currentTheme);
    initParticles();
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
