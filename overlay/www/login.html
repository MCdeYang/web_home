<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>家庭智能终端 - 登录</title>
  <link rel="stylesheet" href="/assets/galaxy-theme.css">
  <style>
    /* 登录页特定样式 */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
    }

    .login-panel {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background: linear-gradient(180deg, rgba(22,27,34,0.9) 0%, rgba(22,27,34,0.6) 100%);
      border: 1px solid var(--glass-border);
      border-top: 2px solid var(--jade-primary);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow-lg), 0 0 60px var(--jade-glow-dim);
      animation: floatIn 0.8s var(--ease-out) both;
      position: relative;
      overflow: hidden;
    }

    .login-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--jade-primary), var(--gold-primary), transparent);
      opacity: 0.8;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      fill: var(--jade-primary);
      filter: drop-shadow(0 0 20px var(--jade-glow));
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--jade-glow)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 25px var(--jade-glow)); }
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--jade-light), var(--gold-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-time {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      background: rgba(1, 4, 9, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 1rem;
      transition: all var(--duration-normal);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--jade-primary);
      box-shadow: 0 0 0 3px var(--jade-glow-dim), 0 0 20px var(--jade-glow-soft);
      background: rgba(1, 4, 9, 0.8);
    }

    .form-input::placeholder {
      color: var(--text-dim);
    }

    .form-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      fill: var(--text-muted);
      transition: all var(--duration-normal);
    }

    .form-group:focus-within .form-icon {
      fill: var(--jade-primary);
      filter: drop-shadow(0 0 5px var(--jade-glow));
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      margin-top: 0.5rem;
      background: linear-gradient(135deg, rgba(0, 210, 106, 0.2), rgba(0, 210, 106, 0.05));
      border: 1px solid rgba(0, 210, 106, 0.5);
      border-radius: var(--radius-md);
      color: var(--jade-light);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--duration-normal);
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s ease;
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:hover {
      background: linear-gradient(135deg, rgba(0, 210, 106, 0.3), rgba(0, 210, 106, 0.1));
      border-color: var(--jade-primary);
      box-shadow: 0 0 30px var(--jade-glow-soft), inset 0 0 10px var(--jade-glow-dim);
      text-shadow: 0 0 8px var(--jade-glow);
      transform: translateY(-2px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      color: #ff6b6b;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.4rem;
      font-size: 0.9rem;
      text-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
    }

    /* 装饰性粒子 */
    .particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    @media (max-width: 480px) {
      .login-panel {
        padding: 2rem 1.5rem;
      }
      
      .login-title {
        font-size: 1.5rem;
      }
      
      .login-logo {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>
<body class="galaxy">
  <canvas id="particles-bg" class="particles-bg"></canvas>
  
  <div class="login-page">
    <div class="login-panel">
      <div class="login-header">
        <svg class="login-logo" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <h1 class="login-title">家庭智能终端</h1>
        <div class="login-time" id="currentTime">----/--/-- --:--:--</div>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <svg class="form-icon" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <input type="text" id="username" class="form-input" placeholder="用户名" required autocomplete="off" />
        </div>
        
        <div class="form-group">
          <svg class="form-icon" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
          <input type="password" id="password" class="form-input" placeholder="密码" required />
        </div>
        
        <button type="submit" class="login-btn">登录</button>
        <div id="errorMsg" class="error-msg"></div>
      </form>
    </div>
  </div>

  <script>
    // === 背景粒子动画 ===
    function initParticles() {
      const canvas = document.getElementById('particles-bg');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      let particles = [];
      
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      
      resize();
      window.addEventListener('resize', resize);
      
      class Particle {
        constructor() {
          this.reset();
        }
        
        reset() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2 + 0.5;
          this.speedX = (Math.random() - 0.5) * 0.2;
          this.speedY = (Math.random() - 0.5) * 0.2;
          this.opacity = Math.random() * 0.4 + 0.1;
          this.color = Math.random() > 0.5 ? '0, 210, 106' : '255, 215, 0';
        }
        
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          
          if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.reset();
          }
        }
        
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
          ctx.fill();
        }
      }
      
      const particleCount = Math.min(50, Math.floor((canvas.width * canvas.height) / 20000));
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
      
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        
        requestAnimationFrame(animate);
      }
      
      animate();
    }

    // === 登录逻辑 ===
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      if (!username || !password) {
        errorMsg.textContent = '请输入用户名和密码';
        return;
      }

      try {
        const response = await fetch('/home/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          window.location.href = '/index.html';
        } else {
          errorMsg.textContent = data.message || '用户名或密码错误';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorMsg.textContent = '网络错误，请检查设备连接';
      }
    });

    // === 时间更新 ===
    function updateTime() {
      const now = new Date();
      const timeStr = now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0') + ' ' +
        String(now.getHours()).padStart(2,'0') + ':' +
        String(now.getMinutes()).padStart(2,'0') + ':' +
        String(now.getSeconds()).padStart(2,'0');
      document.getElementById('currentTime').textContent = timeStr;
    }

    // 初始化
    initParticles();
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
